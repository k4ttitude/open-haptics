[package]
name = "open-haptics"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
nix = { version = "0.31", features = ["poll"] }
serde = { version = "1", features = ["derive"] }
